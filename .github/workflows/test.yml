# PR 테스트 게이트
#
# main에 들어가기 전에 전체 테스트를 돌린다.
#
# 이 워크플로가 없던 동안 테스트가 깨진 채로 main에 머지됐고,
# 한때 242건 중 50건이 실패하는 상태로 배포까지 진행됐다.

name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# 같은 PR에 여러 번 push하면 이전 실행을 취소한다.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Testcontainers를 쓰는 PostgreSQL migration 테스트는 Docker가 필요하다.
      # GitHub 호스티드 러너에는 Docker가 이미 있으므로 별도 설정은 하지 않는다.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: ./gradlew test --no-daemon

      # 실패했을 때 어느 테스트가 깨졌는지 바로 볼 수 있도록 리포트를 남긴다.
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 7
