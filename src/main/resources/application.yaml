spring:
  application:
    name: server
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
  flyway:
    enabled: false
  jpa:
    properties:
      hibernate:
        default_batch_fetch_size: 100

server:
  port: 8080

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

external:
  kakao:
    local:
      base-url: ${KAKAO_LOCAL_BASE_URL:https://dapi.kakao.com}
      rest-api-key: ${KAKAO_REST_API_KEY:}
      connect-timeout: 3s
      read-timeout: 5s
  tour-api:
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
    service-key: ${TOUR_API_KEY:}
    mobile-os: ${TOUR_API_MOBILE_OS:ETC}
    mobile-app: ${TOUR_API_MOBILE_APP:tour-server}
    connect-timeout: 3s
    read-timeout: 10s

app:
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://127.0.0.1:8080,https://busantour.site,https://www.busantour.site}"
    # 비워 두면 CorsProperties 의 기본값을 쓴다. Authorization 이 빠지면 로그인 요청이 preflight 에서 막힌다.
    allowed-headers: "${CORS_ALLOWED_HEADERS:Content-Type,Authorization,X-Trace-Id,Idempotency-Key,X-User-Id}"
    exposed-headers: "${CORS_EXPOSED_HEADERS:X-Trace-Id}"
  auth:
    google:
      # 프론트가 쓰는 값과 같아야 한다. 앱이 붙으면 쉼표로 여러 개를 넣는다.
      client-ids: ${GOOGLE_CLIENT_ID:}
      jwks-cache-ttl: ${GOOGLE_JWKS_CACHE_TTL:6h}
    jwt:
      # 최소 256비트. 값은 .env.server 에만 둔다.
      secret: ${JWT_SECRET:}
      access-ttl: ${JWT_ACCESS_TTL:30m}
      refresh-ttl: ${JWT_REFRESH_TTL:14d}
  schedule-fastapi:
    enabled: ${SCHEDULE_FASTAPI_ENABLED:false}
    base-url: ${SCHEDULE_FASTAPI_BASE_URL:http://127.0.0.1:8010}
    connect-timeout: ${SCHEDULE_FASTAPI_CONNECT_TIMEOUT:3s}
    read-timeout: ${SCHEDULE_FASTAPI_READ_TIMEOUT:15s}
    # -----------
  spontaneous-fastapi:
    enabled: ${SPONTANEOUS_FASTAPI_ENABLED:false}
    base-url: ${SPONTANEOUS_FASTAPI_BASE_URL:http://127.0.0.1:8010}
    connect-timeout: ${SPONTANEOUS_FASTAPI_CONNECT_TIMEOUT:3s}
    read-timeout: ${SPONTANEOUS_FASTAPI_READ_TIMEOUT:30s}
    #---------------
  place-ingestion:
    tour-api:
      enabled: ${TOUR_API_PLACE_INGESTION_ENABLED:false}
      area-code: ${TOUR_API_AREA_CODE:6}
      content-type-ids: ${TOUR_API_CONTENT_TYPE_IDS:12,14,15,28,32,38,39}
      page-size: ${TOUR_API_PAGE_SIZE:100}
      max-pages: ${TOUR_API_MAX_PAGES:1}
      max-requests-per-day: ${TOUR_API_MAX_REQUESTS_PER_DAY:900}
      # 상세 보강은 장소당 TourAPI를 3회 더 호출한다. 소개글·운영정보·이미지는
      # 일정 생성에 쓰이지 않고 장소 상세 화면에만 쓰이므로, 상세를 외부 지도로
      # 넘기면 꺼서 같은 예산으로 약 3배 많은 장소를 발견할 수 있다.
      enrichment-enabled: ${TOUR_API_ENRICHMENT_ENABLED:true}
      scheduler:
        enabled: ${TOUR_API_INGESTION_SCHEDULER_ENABLED:false}
        cron: "${TOUR_API_INGESTION_CRON:0 0 4 * * *}"
    #---------------
  community:
    # 지운 게시물은 retention-days 동안 복구할 수 있고, 그 뒤 이 스케줄러가 실제로 지운다.
    # 끄면 지운 게시물이 영원히 쌓이고 본문과 사진 URL 이 DB 에 남는다.
    post-purge:
      enabled: ${COMMUNITY_POST_PURGE_ENABLED:false}
      retention-days: ${COMMUNITY_POST_RETENTION_DAYS:30}
      cron: "${COMMUNITY_POST_PURGE_CRON:0 30 4 * * *}"
